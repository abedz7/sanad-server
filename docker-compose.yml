# Local development database only.
# No authentication is configured on purpose: the container binds to localhost on the developer's
# machine and holds throwaway data. Any shared or hosted environment must use an authenticated
# MONGODB_URI (see .env.example) — never reuse this compose file for that.
services:
  mongo:
    image: mongo:7
    container_name: sanad-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - sanad-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sanad-mongo-data:
